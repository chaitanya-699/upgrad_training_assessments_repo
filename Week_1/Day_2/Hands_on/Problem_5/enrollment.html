<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Course Enrollment Form</title>
  </head>
  <body>
    <header>
      <h1>Online Course Enrollment</h1>
    </header>

    <main>
      <form>
        <!-- Email -->
        <p>
          <label for="email">Email Address:</label><br />
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </p>

        <!-- Course Suggestions -->
        <p>
          <label for="course">Select Course:</label><br />
          <input
            list="course-list"
            id="course"
            placeholder="Start typing course name"
            required
          />

          <datalist id="course-list">
            <option value="HTML"></option>
            <option value="CSS"></option>
            <option value="JavaScript"></option>
            <option value="React"></option>
            <option value="Python"></option>
          </datalist>
        </p>

        <!-- Experience Number -->
        <p>
          <label for="experience">Years of Experience:</label><br />
          <input
            type="number"
            id="experience"
            min="0"
            max="20"
            placeholder="Enter experience"
            required
          />
        </p>

        <!-- Skill Level -->
        <p>
          <label for="skill">Skill Level:</label><br />
          <input type="range" id="skill" min="1" max="10" value="5" />
          <br />
          Beginner
          <meter min="1" max="10" value="5"></meter>
          Advanced
        </p>

        <!-- Enrollment Progress -->
        <p>
          Enrollment Completion:<br />
          <progress value="60" max="100"></progress>
        </p>

        <button type="submit">Enroll Now</button>
      </form>
    </main>
  </body>
</html>
