<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Styled Webpage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Welcome to My Styled Page</h1>
        <p>This page demonstrates CSS styling and box model.</p>
    </header>

    <section class="info-section">
        <h2>About CSS Styling</h2>
        <p>
            CSS helps in styling webpages using colors, spacing,
            borders, and layout control.
        </p>
    </section>

    <div class="box-model-demo">
        This div demonstrates margin and padding using the CSS box model.
    </div>

    <section class="form-section">
        <h2>Contact Form</h2>

        <form>
            <label>Name:</label>
            <input type="text" placeholder="Enter name">

            <label>Email:</label>
            <input type="email" placeholder="Enter email">

            <label>Message:</label>
            <textarea placeholder="Write message"></textarea>

            <button type="submit">Submit</button>
        </form>
    </section>

</body>
</html>
