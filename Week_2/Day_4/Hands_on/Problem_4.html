<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Landing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">ShopNow</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>

<div class="offcanvas offcanvas-end" id="menu">
    <div class="offcanvas-header">
        <h5>Menu</h5>
        <button class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <a href="#" class="d-block mb-2">Home</a>
        <a href="#" class="d-block mb-2">Products</a>
        <a href="#" class="d-block">Contact</a>
    </div>
</div>

<div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="https://via.placeholder.com/1200x400" class="d-block w-100">
        </div>
        <div class="carousel-item">
            <img src="https://via.placeholder.com/1200x400" class="d-block w-100">
        </div>
    </div>
</div>

<div class="container py-5">
    <h2 class="text-center mb-4">Featured Products</h2>
    <div class="row g-4">
        <div class="col-sm-6 col-lg-3">
            <div class="card shadow h-100">
                <div class="card-body text-center">
                    <h5>Smartphone</h5>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>
        </div>
    </div>
</div>

<section class="bg-dark text-white py-4">
    <div class="container text-center">
        <h5>Subscribe to Newsletter</h5>
        <form class="row justify-content-center">
            <div class="col-md-4">
                <input type="email" class="form-control mb-2" placeholder="Enter email">
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100">Subscribe</button>
            </div>
        </form>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
